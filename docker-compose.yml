services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: classia
      POSTGRES_USER: classia
      POSTGRES_PASSWORD: classia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classia -d classia"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./classia_back
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://classia:classia@postgres:5432/classia
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./classia_front
      dockerfile: Dockerfile
    ports:
      - "8080:80"

volumes:
  postgres_data:
